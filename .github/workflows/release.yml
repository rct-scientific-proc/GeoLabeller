# Build the Windows MSI installer and publish it as a GitHub Release.
#
# To cut a release, declare the version first, then tag it:
#     echo 1.2.0 > VERSION
#     python docs_workspace/build_icd.py     # stamps VERSION on the ICD cover
#     git commit -am "Release 1.2.0"
#     git tag -a v1.2.0 -m "GeoLabeller 1.2.0"
#     git push origin master v1.2.0
#
# VERSION exists because the ICD is built and committed before the tag it
# belongs to, so it cannot learn its version from the tags. This workflow
# refuses to build a tag that disagrees with it.
#
# The tag name (minus the leading "v") becomes the MSI's ProductVersion, which
# is what lets Windows Installer upgrade an existing install in place - so the
# version must increase with every release, or the installer refuses with
# "Another version of this product is already installed".
#
# The workflow can also be run by hand from the Actions tab ("Run workflow")
# with a version typed in; that builds and uploads the MSI as a build artifact
# without publishing a release, which is handy for testing the pipeline.
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, X.Y.Z (e.g. 1.2.0). No release is published."
        required: true

# The job creates a release, which needs write access to repository contents.
permissions:
  contents: write

jobs:
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # cx_Freeze bakes this interpreter into the executable, so pin it rather
      # than inheriting whatever the runner image happens to ship.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = '${{ inputs.version }}'
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must be X.Y.Z (got '$version'). Tag releases as v1.2.0."
          }
          # VERSION is what the ICD stamps on its cover, and is written before
          # the tag exists. Catching a disagreement here is the only chance to
          # notice it: nothing downstream reads both.
          $declared = (Get-Content VERSION -Raw).Trim() -replace '^v', ''
          if ($declared -ne $version) {
            throw ("VERSION says $declared but this build is $version. " +
                   "Update VERSION, rebuild the ICD, commit, then move the tag.")
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 -Append
          Write-Host "Building GeoLabeller $version"

      # -NoProxy skips the corporate-proxy autodetection, which has nothing to
      # find on a hosted runner and only costs time. -Wix packages with the WiX
      # toolset rather than cx_Freeze's bdist_msi, so the installer can ask
      # about scope and shortcuts; the script installs WiX itself on first use,
      # which the runner's preinstalled .NET SDK is enough for. Shortcuts are no
      # longer a build-time switch, which is why -Shortcut is gone.
      - name: Build the MSI
        shell: pwsh
        run: |
          # A checked-out .ps1 can trip the runner's execution policy; scope the
          # bypass to this process only.
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./build/build_windows.ps1 `
            -Msi `
            -Wix `
            -Clean `
            -NoProxy `
            -Version ${{ steps.version.outputs.version }} `
            -Author "RCT Scientific Processing" `
            -Url "https://github.com/${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) { throw "build_windows.ps1 failed" }

      - name: Check the MSI was produced
        shell: pwsh
        run: |
          $msi = Get-ChildItem build/dist/*.msi -ErrorAction SilentlyContinue
          if (-not $msi) { throw "No .msi found in build/dist" }
          $msi | ForEach-Object {
            "{0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB) | Write-Host
          }

      # Kept for every run, including manual ones, so a build can be downloaded
      # and tested before any release exists.
      - name: Upload the installer as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoLabeller-${{ steps.version.outputs.version }}-windows-msi
          path: |
            build/dist/*.msi
            build/dist/*.msi.sha256
          if-no-files-found: error
          retention-days: 30

      # Only tag pushes publish. gh is preinstalled on GitHub runners, so this
      # needs no third-party action.
      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # @() forces an array even when a single file matches, and PowerShell
          # expands an array into separate arguments for a native command - so
          # do NOT splat with @files here, which breaks on a scalar.
          $files = @(
            Get-ChildItem build/dist/*.msi, build/dist/*.msi.sha256 |
              ForEach-Object { $_.FullName }
          )
          Write-Host "Attaching $($files.Count) file(s):"
          $files | ForEach-Object { Write-Host "  $_" }
          # The API answered 503 for twenty minutes during an incident on
          # 2026-08-17 and took two releases with it, after their installers
          # had already been built and attached. The build is the expensive
          # part, so wait the outage out here rather than making someone
          # notice the failure and re-run it by hand.
          $delays = @(15, 30, 60, 120, 240)
          for ($attempt = 0; ; $attempt++) {
            gh release create $env:GITHUB_REF_NAME `
              --title "GeoLabeller $($env:GITHUB_REF_NAME)" `
              --generate-notes `
              $files
            if ($LASTEXITCODE -eq 0) { break }

            # An attempt can create the release and still fail while uploading,
            # after which every later create fails with "already exists" - so
            # try attaching to it before deciding this attempt got nowhere.
            Write-Host "Create failed; trying to attach to an existing release."
            gh release upload $env:GITHUB_REF_NAME $files --clobber
            if ($LASTEXITCODE -eq 0) { break }

            if ($attempt -ge $delays.Count) {
              throw "gh release create failed after $($attempt + 1) attempts"
            }
            Write-Host "Retrying in $($delays[$attempt])s."
            Start-Sleep -Seconds $delays[$attempt]
          }
